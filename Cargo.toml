[workspace]
members  = [
  "examples",
  "glommio",
  "glommio-dense-registry",
  "glommio-idle",
  "glommio-macros",
]
resolver = "2"

[workspace.package]
version = "0.11.0"
# This is also documented in the README.md under "Supported Rust Versions"
rust-version = "1.92"

[workspace.dependencies]
glommio-dense-registry = { path = "glommio-dense-registry", version = "0.11.0" }
glommio-idle = { path = "glommio-idle", version = "0.11.0" }
glommio-macros = { path = "glommio-macros", version = "0.11.0" }

[workspace.metadata.dylint]
  libraries = [
  { git = "https://gitlab.com/oss47/rusty/diy_lints", rev = "9d967b5cbe907766fad0142e866397c365c8851a" },
]
